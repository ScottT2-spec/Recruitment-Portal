<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Telesales Recruitment</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <span class="login-logo-mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z" fill="currentColor"/></svg>
        </span>
        <span class="login-logo-word">Recruitment</span>
      </div>

      <h1>Welcome Back</h1>
      <p class="lede">Sign in to your dashboard</p>

      <form id="loginForm">
        <div class="field-icon">
          <label for="email">Email address</label>
          <div class="field-icon-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z" stroke="currentColor" stroke-width="1.6"/><path d="m4 6.5 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="email" type="email" placeholder="you@example.com" required autocomplete="username">
          </div>
        </div>

        <div class="field-icon">
          <label for="password">Password</label>
          <div class="field-icon-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 10.5V7.8a4.5 4.5 0 0 1 9 0v2.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="login-error" style="display:none;"></div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-block login-submit" type="submit">Sign In</button>
      </form>

      <div class="login-hint">Demo admin: admin@company.com / Telesales2026!</div>
    </div>

    <p class="login-footnote">Admin access only · Contact your recruitment lead for an invite</p>
  </div>

<script>
const pwInput = document.getElementById('password');
const pwToggle = document.getElementById('pwToggle');
pwToggle.addEventListener('click', () => {
  const isPw = pwInput.type === 'password';
  pwInput.type = isPw ? 'text' : 'password';
  pwToggle.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
  pwToggle.classList.toggle('is-visible', isPw);
});

document.getElementById('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  alert('Password resets aren\'t self-service yet — please ask your recruitment admin to reset it for you.');
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const remember = document.getElementById('rememberMe').checked;
  const errEl = document.getElementById('loginError');
  const btn = e.target.querySelector('.login-submit');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, remember })
    });
    if (res.ok) {
      location.href = '/admin/';
      return;
    }
    const json = await res.json().catch(() => ({}));
    errEl.textContent = json.error || 'Unable to sign in.';
    errEl.style.display = 'block';
  } catch (err) {
    errEl.textContent = 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
