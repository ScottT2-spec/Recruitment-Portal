<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Console</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<div class="mobile-tabs" id="mobileTabs"></div>

<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/img/prokip-logo-white.png" alt="Prokip" class="brand-logo">
    </div>
    <nav id="sideNav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div id="userName">—</div>
        <div class="role" id="userRole">—</div>
      </div>
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn" style="border-color: rgba(255,255,255,0.2); color: #fff;">Log out</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-head">
      <h1 id="pageTitle">Dashboard</h1>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalRoot"></div></div>
<div class="toast" id="toast"></div>

<script src="/js/admin.js"></script>
</body>
</html>
