<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Application Status</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  body { background: var(--surface); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 48px 20px 80px; }
  .back-link { font-size: 13.5px; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 22px; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  .lede { color: var(--ink-soft); margin-bottom: 24px; font-size: 14.5px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 8px; }
  .stage-track { display: flex; flex-direction: column; gap: 0; margin-top: 22px; }
  .stage-item { display: flex; gap: 12px; padding: 10px 0; }
  .stage-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-alt); flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size: 11px; }
  .stage-item.done .stage-dot { background: var(--primary); color: #fff; }
  .stage-item.current .stage-dot { background: var(--amber); color: #fff; }
  #result { display: none; }
  .status-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="back-link">← Back to job posting</a>
  <h1>Check your status</h1>
  <p class="lede">Enter your Application ID, or the email/phone you applied with.</p>

  <div class="field"><label>Application ID</label><input id="appId" placeholder="APP-XXXXXX"></div>
  <div class="lede" style="text-align:center; margin: 4px 0;">— or —</div>
  <div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com"></div>
  <div class="field"><label>Phone number</label><input id="phone" type="tel" placeholder="080..."></div>
  <button class="btn btn-primary btn-block" id="lookupBtn">Check status</button>

  <div id="error" style="color: var(--danger); font-size: 13.5px; margin-top: 10px;"></div>

  <div id="result">
    <div class="status-card">
      <div style="font-family: var(--font-mono); font-size: 13px; color: var(--muted);" id="rAppId"></div>
      <h3 id="rName" style="margin: 6px 0 4px;"></h3>
      <div id="rStageLabel" class="pill pill-received" style="margin-bottom: 14px;"></div>
      <div class="stage-track" id="track"></div>
    </div>
  </div>
</div>

<script>
const STAGES = [
  { key: 'application_received', label: 'Application Received' },
  { key: 'under_review', label: 'Under Review' },
  { key: 'interview', label: 'Interview' },
  { key: 'recruited', label: 'Recruited' },
];

document.getElementById('lookupBtn').addEventListener('click', async () => {
  const appId = document.getElementById('appId').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const err = document.getElementById('error');
  err.textContent = '';

  if (!appId && !email && !phone) { err.textContent = 'Please enter an Application ID, email, or phone.'; return; }

  const params = new URLSearchParams();
  if (appId) params.set('application_id', appId);
  if (email) params.set('email', email);
  if (phone) params.set('phone', phone);

  const res = await fetch('/api/apply/status?' + params.toString());
  if (!res.ok) { err.textContent = 'We couldn\u2019t find an application matching that information.'; document.getElementById('result').style.display = 'none'; return; }
  const a = await res.json();

  document.getElementById('result').style.display = 'block';
  document.getElementById('rAppId').textContent = a.application_id;
  document.getElementById('rName').textContent = `${a.first_name || ''} ${a.last_name || ''}`;

  const stageMeta = {
    application_received: ['Application Received', 'pill-received'],
    under_review: ['Under Review', 'pill-review'],
    interview: ['Interview Stage', 'pill-interview'],
    recruited: ['Recruited 🎉', 'pill-recruited'],
    rejected: ['Not Selected', 'pill-rejected'],
    withdrawn: ['Withdrawn', 'pill-withdrawn'],
  };
  const [label, cls] = stageMeta[a.recruitment_stage] || stageMeta.application_received;
  const badge = document.getElementById('rStageLabel');
  badge.textContent = label;
  badge.className = 'pill ' + cls;

  const currentIdx = STAGES.findIndex(s => s.key === a.recruitment_stage);
  document.getElementById('track').innerHTML = STAGES.map((s, i) => {
    let cls = '';
    if (a.recruitment_stage === 'rejected' || a.recruitment_stage === 'withdrawn') {
      cls = i === 0 ? 'done' : '';
    } else if (i < currentIdx) cls = 'done';
    else if (i === currentIdx) cls = 'current';
    return `<div class="stage-item ${cls}"><div class="stage-dot">${cls === 'done' ? '✓' : i+1}</div><div>${s.label}</div></div>`;
  }).join('');

  if (a.interview_status === 'scheduled' && a.interview_date) {
    document.getElementById('track').innerHTML += `<div class="status-card" style="margin-top:14px; padding:14px;">
      <strong style="font-size:13.5px;">Interview scheduled</strong>
      <div style="font-size:13.5px; color:var(--ink-soft); margin-top:4px;">${a.interview_date} at ${a.interview_time || ''} · ${a.interview_type || ''}</div>
    </div>`;
  }
});
</script>
</body>
</html>
