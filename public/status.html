<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Application Status</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
<style>
  body { background: var(--surface); }
  .status-hero {
    background: radial-gradient(ellipse 90% 60% at 15% 0%, rgba(245,183,49,0.16), transparent 55%),
                linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
    padding: 40px 0 64px; color: #fff;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px; }
  .status-hero .wrap { padding-top: 20px; }
  .back-link {
    font-size: 13.5px; color: rgba(255,255,255,0.6); text-decoration: none; display: inline-flex;
    align-items: center; gap: 6px; margin-bottom: 22px; transition: color .15s ease;
  }
  .back-link:hover { color: var(--gold-300); }
  .back-link svg { width: 14px; height: 14px; }
  .status-hero h1 { font-size: 28px; margin-bottom: 8px; color: #fff; display: flex; align-items: center; gap: 10px; }
  .status-hero h1 .h-ico {
    width: 38px; height: 38px; border-radius: 11px; background: rgba(245,183,49,0.14); color: var(--gold-300);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .status-hero h1 .h-ico svg { width: 19px; height: 19px; }
  .lede { color: rgba(255,255,255,0.65); margin-bottom: 0; font-size: 14.5px; }

  .lookup-card {
    background: var(--base); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    padding: 26px; margin-top: -40px; position: relative; z-index: 2; border: 1px solid var(--border);
  }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--ink-soft); }
  .field .input-wrap { position: relative; }
  .field .input-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted);
  }
  .field input {
    width: 100%; padding: 13px 14px 13px 40px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .field input:focus { border-color: var(--gold-500); outline: none; box-shadow: 0 0 0 4px rgba(234,166,17,0.12); }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; margin: 16px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .stage-track { display: flex; flex-direction: column; gap: 0; margin-top: 22px; }
  .stage-item { display: flex; gap: 12px; padding: 10px 0; position: relative; }
  .stage-item:not(:last-child)::before {
    content: ''; position: absolute; left: 10px; top: 32px; bottom: -4px; width: 2px; background: var(--border);
  }
  .stage-item.done:not(:last-child)::before { background: var(--gold-400); }
  .stage-dot {
    width: 22px; height: 22px; border-radius: 50%; background: var(--surface-alt); flex-shrink: 0; display:flex;
    align-items:center; justify-content:center; font-size: 11px; font-weight: 700; color: var(--ink-soft); z-index: 1;
  }
  .stage-dot svg { width: 12px; height: 12px; }
  .stage-item.done .stage-dot { background: linear-gradient(135deg, var(--gold-300), var(--gold-500)); color: var(--navy-900); }
  .stage-item.current .stage-dot { background: var(--navy-700); color: #fff; }
  .stage-item-label { padding-top: 2px; font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .stage-item.done .stage-item-label, .stage-item.current .stage-item-label { color: var(--ink); }

  #result { display: none; }
  .status-card {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-top: 22px;
  }
  .app-id-tag {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--gold-600); background: var(--gold-tint);
    display: inline-block; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(202,138,4,0.15);
  }
  .error-msg { display: flex; gap: 8px; align-items: center; color: var(--danger); font-size: 13.5px; margin-top: 10px; }
  .error-msg svg { width: 15px; height: 15px; flex-shrink: 0; }
  .interview-note { display: flex; gap: 10px; align-items: flex-start; }
  .interview-note svg { width: 16px; height: 16px; color: var(--gold-600); flex-shrink: 0; margin-top: 2px; }
</style>
</head>
<body>

<div class="status-hero">
  <div class="wrap">
    <img src="/img/prokip-logo-white.png" alt="Prokip" style="height:22px; width:auto; margin-bottom:18px;">
    <a href="/" class="back-link"><i data-lucide="arrow-left"></i> Back to job posting</a>
    <h1><span class="h-ico"><i data-lucide="search-check"></i></span> Check your status</h1>
    <p class="lede">Enter your Application ID, or the email and phone number you applied with.</p>
  </div>
</div>

<div class="wrap" style="padding-bottom: 60px;">
  <div class="lookup-card">
    <div class="field">
      <label>Application ID</label>
      <div class="input-wrap"><i data-lucide="hash"></i><input id="appId" placeholder="APP-XXXXXX"></div>
    </div>
    <div class="divider">or both of</div>
    <div class="field">
      <label>Email address</label>
      <div class="input-wrap"><i data-lucide="mail"></i><input id="email" type="email" placeholder="you@example.com"></div>
    </div>
    <div class="field">
      <label>Phone number</label>
      <div class="input-wrap"><i data-lucide="phone"></i><input id="phone" type="tel" placeholder="080..."></div>
    </div>
    <button class="btn btn-primary btn-block" id="lookupBtn"><i data-lucide="search" style="width:16px;height:16px;"></i> Check status</button>

    <div id="error" class="error-msg"></div>
  </div>

  <div id="result">
    <div class="status-card">
      <div class="app-id-tag" id="rAppId"></div>
      <h3 id="rName" style="margin: 10px 0 8px;"></h3>
      <div id="rStageLabel" class="pill pill-received" style="margin-bottom: 16px;"></div>
      <div class="stage-track" id="track"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
if (window.lucide) lucide.createIcons();

const STAGES = [
  { key: 'application_received', label: 'Application Received' },
  { key: 'under_review', label: 'Under Review' },
  { key: 'interview', label: 'Interview' },
  { key: 'recruited', label: 'Recruited' },
];

document.getElementById('lookupBtn').addEventListener('click', async () => {
  const appId = document.getElementById('appId').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const err = document.getElementById('error');
  err.innerHTML = '';

  if (!appId && !(email && phone)) {
    err.innerHTML = '<i data-lucide="alert-circle"></i> Please enter your Application ID, or both your email and phone number.';
    lucide.createIcons();
    return;
  }

  const params = new URLSearchParams();
  if (appId) params.set('application_id', appId);
  if (email) params.set('email', email);
  if (phone) params.set('phone', phone);

  const res = await fetch('/api/apply/status?' + params.toString());
  if (!res.ok) {
    err.innerHTML = '<i data-lucide="alert-circle"></i> We couldn\u2019t find an application matching that information.';
    lucide.createIcons();
    document.getElementById('result').style.display = 'none';
    return;
  }
  const a = await res.json();

  document.getElementById('result').style.display = 'block';
  document.getElementById('rAppId').textContent = a.application_id;
  document.getElementById('rName').textContent = `${a.first_name || ''} ${a.last_name || ''}`;

  const stageMeta = {
    application_received: ['Application Received', 'pill-received'],
    under_review: ['Under Review', 'pill-review'],
    interview: ['Interview Stage', 'pill-interview'],
    recruited: ['Recruited', 'pill-recruited'],
    rejected: ['Not Selected', 'pill-rejected'],
    withdrawn: ['Withdrawn', 'pill-withdrawn'],
  };
  const [label, cls] = stageMeta[a.recruitment_stage] || stageMeta.application_received;
  const badge = document.getElementById('rStageLabel');
  badge.textContent = label;
  badge.className = 'pill ' + cls;

  const currentIdx = STAGES.findIndex(s => s.key === a.recruitment_stage);
  document.getElementById('track').innerHTML = STAGES.map((s, i) => {
    let cls = '';
    if (a.recruitment_stage === 'rejected' || a.recruitment_stage === 'withdrawn') {
      cls = i === 0 ? 'done' : '';
    } else if (i < currentIdx) cls = 'done';
    else if (i === currentIdx) cls = 'current';
    const dotContent = cls === 'done' ? '<i data-lucide="check"></i>' : (i + 1);
    return `<div class="stage-item ${cls}"><div class="stage-dot">${dotContent}</div><div class="stage-item-label">${s.label}</div></div>`;
  }).join('');

  if (a.interview_status === 'scheduled' && a.interview_date) {
    document.getElementById('track').innerHTML += `<div class="status-card" style="margin-top:14px; padding:16px;">
      <div class="interview-note">
        <i data-lucide="calendar-clock"></i>
        <div>
          <strong style="font-size:13.5px;">Interview scheduled</strong>
          <div style="font-size:13.5px; color:var(--ink-soft); margin-top:4px;">${a.interview_date} at ${a.interview_time || ''} · ${a.interview_type || ''}</div>
        </div>
      </div>
    </div>`;
  }

  lucide.createIcons();
});
</script>
</body>
</html>
